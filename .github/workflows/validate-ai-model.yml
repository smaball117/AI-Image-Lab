name: Validate AI Model Photography Text-to-Image Skill
on:
  push:
    branches:
      - experiment/ai-model-photography-v0.3
    paths:
      - '.agents/skills/ai-model-photography/**'
      - '.github/workflows/validate-ai-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skill structure and six-dimension instructions
        run: python .agents/skills/ai-model-photography/scripts/validate_skill.py
      - name: Validate authored scenario specifications
        run: python .agents/skills/ai-model-photography/scripts/test_optimization_cases.py
